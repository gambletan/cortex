[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "cortex-ai-memory"
version = "1.8.0"
description = "Private. Free. Local. — Memory engine for personal AI agents."
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Alvin Tang" }
]
keywords = ["ai", "memory", "llm", "agent", "local", "privacy", "embedding", "vector-search"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
readme = "README.md"

[project.urls]
Repository = "https://github.com/gambletan/cortex"
Documentation = "https://github.com/gambletan/cortex#quick-start"

[tool.maturin]
features = ["pyo3/extension-module"]
