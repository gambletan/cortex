[package]
name = "cortex-wasm"
version = "2.0.0"
edition = "2021"
description = "Cortex memory engine — browser WASM build for interactive demos"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Release profile inherited from workspace root (lto=true, codegen-units=1)
