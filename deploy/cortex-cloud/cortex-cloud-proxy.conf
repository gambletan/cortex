# Shared proxy settings for Cortex Cloud (installed as /etc/nginx/cortex-cloud-proxy.conf).
proxy_http_version 1.1;
proxy_set_header Host $host;
# cortex-cloud trusts only the LAST X-Forwarded-For entry, and only from loopback.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_request_buffering off;
proxy_read_timeout 60s;
# Don't log query strings or bodies for these paths (consent capabilities live there).
access_log off;
