# Cortex Cloud for Muse — only these paths go to cortex-cloud (127.0.0.1:8084); everything
# else on the site keeps going to its own app. Installed as /etc/nginx/snippets/cortex-cloud.conf
# by deploy.sh and included in the site's 443 server block.

location ^~ /t/ {
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    access_log off; # consent capabilities and tokens live in these requests
}
location ^~ /.well-known/oauth-authorization-server/t/ {
    proxy_pass http://127.0.0.1:8084;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    access_log off;
}
location ^~ /.well-known/oauth-protected-resource/t/ {
    proxy_pass http://127.0.0.1:8084;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    access_log off;
}
location ^~ /api/tenants {
    client_max_body_size 24m;
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_request_buffering off;
    access_log off;
}
