# Cortex Cloud for Muse behind an existing nginx site (e.g. studio.alvinsclub.ai).
# Include inside that site's `server { listen 443 ssl; ... }` block. Only these paths go to
# cortex-cloud; everything else keeps going to the existing app.

# Muse-facing (per tenant) and the RFC 8414 / 9728 "inserted" discovery forms.
location ^~ /t/ {
    proxy_pass http://127.0.0.1:8787;
    include /etc/nginx/cortex-cloud-proxy.conf;
}
location ^~ /.well-known/oauth-authorization-server/t/ {
    proxy_pass http://127.0.0.1:8787;
    include /etc/nginx/cortex-cloud-proxy.conf;
}
location ^~ /.well-known/oauth-protected-resource/t/ {
    proxy_pass http://127.0.0.1:8787;
    include /etc/nginx/cortex-cloud-proxy.conf;
}
# Device API (signed). Export pushes can be up to 12 MiB.
location ^~ /api/tenants {
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:8787;
    include /etc/nginx/cortex-cloud-proxy.conf;
}
