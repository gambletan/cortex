# Dedicated Cortex host. Install only after obtaining a certificate for this hostname.
# deploy.sh installs /etc/nginx/snippets/cortex-cloud.conf before checking/reloading nginx.
server {
    listen 80;
    server_name cortex.alvinsclub.ai;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://cortex.alvinsclub.ai$request_uri;
    }
    access_log off; # enrollment capabilities can appear in request paths
}

server {
    listen 443 ssl;
    server_name cortex.alvinsclub.ai;
    ssl_certificate /etc/letsencrypt/live/cortex.alvinsclub.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cortex.alvinsclub.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/cortex-cloud.conf;

    # Public health check has no tenant data or credentials.
    location = /healthz {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
    }
    location / {
        return 404;
    }
    access_log off;
}
