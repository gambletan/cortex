[package]
name = "cortex-core"
version = "2.0.0"
edition = "2021"

[features]
default = ["encrypted-db"]
embeddings = ["fastembed"]
encrypted-db = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
tracing = "0.1"
parking_lot = "0.12"
instant-distance = "0.6"
sha2 = "0.10"
semver = "1"
lru = "0.12"
half = "2"
rayon = "1"
dirs = "5"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
hmac = "0.12"
subtle = "2"
zstd = "0.13"
fastembed = { version = "4", optional = true }
notify = "6"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "memory_index_bench"
harness = false

[[bench]]
name = "comparison_bench"
harness = false
