name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: darwin-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-arm64
            cross: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        if: ${{ !matrix.cross }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build full version
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p cortex-mcp-server
          else
            cargo build --release --target ${{ matrix.target }} -p cortex-mcp-server
          fi

      - name: Package full version
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cortex-mcp-server dist/
          cd dist && tar czf ../cortex-mcp-server-${{ matrix.suffix }}.tar.gz cortex-mcp-server
          cd .. && rm -rf dist

      - name: Build lite version (no embeddings)
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p cortex-mcp-server --no-default-features
          else
            cargo build --release --target ${{ matrix.target }} -p cortex-mcp-server --no-default-features
          fi

      - name: Package lite version
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cortex-mcp-server dist/
          cd dist && tar czf ../cortex-mcp-server-lite-${{ matrix.suffix }}.tar.gz cortex-mcp-server
          cd .. && rm -rf dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: cortex-mcp-server*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: cortex-mcp-server*.tar.gz
          generate_release_notes: true
