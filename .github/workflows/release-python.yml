name: Release Python Wheels

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one target cancel the others mid-build.
      fail-fast: false
      matrix:
        # Both macOS arches cross-build on the macos-latest (Apple-silicon) runner — the
        # retired macos-13/Intel runner that queued forever is no longer referenced (this is
        # the same approach release-binary.yml uses for x86_64-apple-darwin). Omitted:
        # aarch64-linux & windows-msvc (native-dep cross-builds not yet sorted); those users
        # install from the sdist, which always ships.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            # Apple-silicon minimum; pin so the wheel tag is explicit, not host-SDK-derived.
            macos_deployment_target: "11.0"
          - os: macos-latest
            target: x86_64-apple-darwin
            # CRITICAL: this x86_64 wheel is CROSS-built on an Apple-silicon runner. Without an
            # explicit floor the wheel can inherit the host's macOS-14/15 SDK and be tagged
            # macosx_14_*_x86_64 — which pip on older Intel Macs rejects, silently falling back
            # to the sdist and defeating the point of shipping the wheel at all. Pin to 10.12.
            macos_deployment_target: "10.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          # Empty on the Linux leg (matrix field absent) — harmless, ignored off-macOS.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m cortex-python/Cargo.toml
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m cortex-python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/cortex-ai-memory
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
