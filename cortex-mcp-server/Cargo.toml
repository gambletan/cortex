[package]
name = "cortex-mcp-server"
version = "2.3.0"
edition = "2021"
description = "MCP server for Cortex memory engine — gives LLMs persistent memory"

[features]
default = ["embeddings", "gateway"]
embeddings = ["cortex-core/embeddings"]
# Muse gateway (remote MCP over HTTP). Off in the lite build, which keeps zero network code.
gateway = ["dep:axum", "dep:tower", "dep:tower-http"]

[dependencies]
cortex-core = { path = "../cortex-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
rand = "0.8"
axum = { version = "0.8", optional = true }
tower = { version = "0.5", features = ["limit"], optional = true }
tower-http = { version = "0.6", features = ["timeout"], optional = true }
